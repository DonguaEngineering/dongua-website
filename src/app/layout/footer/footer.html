<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-brand">
            <a
                class="footer-logo"
                [routerLink]="['/', routes.home]"
                aria-label="Dongua Engineering"
            >
                <img
                    src="brand/logo-on-dark.svg"
                    alt="Dongua Engineering"
                />
            </a>

            <p i18n="@@footerDescription">
                Electrical engineering and industrial automation support for
                system integrators, panel builders and engineering contractors.
            </p>
        </div>

        <nav
            class="footer-navigation"
            aria-label="Footer navigation"
            i18n-aria-label="@@footerNavigationLabel"
        >
            <p class="footer-heading" i18n="@@footerNavigationHeading">
                Navigation
            </p>

            <a [routerLink]="['/', routes.about]" i18n="@@footerAbout">
                About
            </a>

            <a [routerLink]="['/', routes.services]" i18n="@@footerServices">
                Services
            </a>

            <a [routerLink]="['/', routes.industries]" i18n="@@footerIndustries">
                Industries
            </a>

            <a [routerLink]="['/', routes.contact]" i18n="@@footerContact">
                Contact
            </a>
        </nav>

        <div class="footer-contact">
            <p class="footer-heading" i18n="@@footerContactHeading">
                Contact
            </p>

            <a href="mailto:edongua@donguaengineering.com">
                edongua@donguaengineering.com
            </a>
        </div>
    </div>

    <div class="footer-bottom">
        <div class="footer-bottom-container">
            <p>
                © {{ currentYear }} Dongua Engineering Solutions S.L.
                <span i18n="@@footerRights">All rights reserved.</span>
            </p>
        </div>
    </div>
</footer>
